SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off

# Logging
SecAuditEngine RelevantOnly
SecAuditLog /var/log/apache2/modsec_audit.log

# Limits
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072

# Performance
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# OWASP CRS (fresh clone)
IncludeOptional /usr/share/modsecurity-crs/crs-setup.conf
IncludeOptional /usr/share/modsecurity-crs/rules/*.conf

# Custom rules — IDs >= 1,000,000
SecAction "id:1000100,phase:1,pass,nolog,setvar:ip.requests=+1,expirevar:ip.requests=60"
SecRule IP:REQUESTS "@gt 120" \
 "id:1000101,phase:2,deny,status:429,msg:'Rate limit exceeded'"
SecRule REQUEST_HEADERS:User-Agent "sqlmap" "id:1000102,phase:1,deny,msg:'sqlmap blocked'"
SecRule REQUEST_HEADERS:User-Agent "(nikto|nmap|acunetix|masscan)" "id:1000103,phase:1,deny,msg:'scanner blocked'"
