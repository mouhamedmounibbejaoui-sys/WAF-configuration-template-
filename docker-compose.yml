version: '3.8'

services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stage-flask-app
    expose:
      - "5000"
    volumes:
      - .:/app
    environment:
      - FLASK_APP=webapp.py
      - FLASK_ENV=development
    networks:
      - stage-network

  apache:
    build:
      context: .
      dockerfile: Dockerfile.apache
    container_name: stage-apache-waf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - flask-app
    networks:
      - stage-network

networks:
  stage-network:
    driver: bridge
