<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a1a2f, #000000);
            color: white;
        }

        .box {
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            opacity: 0.8;
        }
    </style>
</head>

<body class="d-flex flex-column">

<div class="container my-4 flex-grow-1">

    <!-- Header -->
    <header class="box text-center">
        <h1>Stage.tn</h1>
        <p class="mb-0">Cloud Web Application Secured with WAF</p>
    </header>

    <!-- Navigation -->
    <nav class="box d-flex justify-content-center gap-4">
        <a href="/login" class="btn btn-outline-light" target="abb">Login</a>
        <a href="/registre" class="btn btn-outline-light" target="abb">Register</a>
    </nav>

    <!-- Main Section -->
    <section class="box">
        <h3>Welcome</h3>
        <p>
            This application is intentionally simple and vulnerable,
            designed to demonstrate Web Application Firewall (WAF) protection
            against common web attacks.
        </p>
        <div >
            <iframe name="abb" src="/login" style="width:100%; height:600px; border:none; background:transparent;"></iframe></iframe></div>
    </section>

</div>

<!-- Footer -->
<footer class="box mx-4 mb-3">
    © 2026 stage.tn
</footer>

</body>
</html>
