<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0a1a2f, #000000);
            color: white;
            min-height: 100vh;
        }
        .container {
            margin-top: 30px;
        }
        .box {
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 30px;
        }
        .preview {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 20px;
            min-height: 150px;
            word-break: break-word;
            margin-top: 20px;
        }
        .font-selector {
            margin-bottom: 20px;
        }
        select.form-control {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        select.form-control option {
            background-color: #0a1a2f;
            color: white;
        }
        textarea.form-control {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Welcome, {{ username }}!</h2>
            <a href="/logout" class="btn btn-outline-light">Logout</a>
        </div>

        <div class="box">
            <h3>Text Beautifier</h3>
            <p>Choose a font style and enter your text to beautify it.</p>

            <!-- Form that POSTS to /preview endpoint -->
            <form id="previewForm" method="POST" action="/preview">
                <div class="font-selector">
                    <label for="fontSelect" class="form-label">Choose Font Style:</label>
                    <select class="form-control" id="fontSelect" name="fontSelect">
                        <option value="arial">Arial</option>
                        <option value="georgia">Georgia</option>
                        <option value="times">Times New Roman</option>
                        <option value="courier">Courier New</option>
                        <option value="verdana">Verdana</option>
                        <option value="trebuchet">Trebuchet MS</option>
                        <option value="impact">Impact</option>
                        <option value="comic">Comic Sans MS</option>
                        <option value="palatino">Palatino</option>
                        <option value="garamond">Garamond</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="textInput" class="form-label">Enter Text:</label>
                    <textarea class="form-control" id="textInput" name="textInput" rows="5" placeholder="Type your text here..."></textarea>
                </div>

                <button type="button" class="btn btn-outline-light" onclick="submitPreview(event)">Preview</button>
            </form>

            <!-- Preview section with VULNERABLE innerHTML -->
            <div class="preview" id="previewSection" style="display:none;">
                <h5>Preview:</h5>
                <div id="preview" style="font-size: 20px; margin-top: 15px; word-wrap: break-word;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const fonts = {
            'arial': 'Arial, sans-serif',
            'georgia': 'Georgia, serif',
            'times': '"Times New Roman", Times, serif',
            'courier': '"Courier New", Courier, monospace',
            'verdana': 'Verdana, sans-serif',
            'trebuchet': '"Trebuchet MS", sans-serif',
            'impact': 'Impact, sans-serif',
            'comic': '"Comic Sans MS", cursive',
            'palatino': '"Palatino Linotype", "Book Antiqua", Palatino, serif',
            'garamond': 'Garamond, serif'
        };

        function submitPreview(event) {
            event.preventDefault();
            
            const textInput = document.getElementById('textInput').value;
            const fontSelect = document.getElementById('fontSelect').value;
            const preview = document.getElementById('preview');
            const previewSection = document.getElementById('previewSection');
            
            // VULNERABLE: Using innerHTML allows XSS
            // If XSS payload passes WAF, it will execute here
            preview.innerHTML = textInput;
            preview.style.fontFamily = fonts[fontSelect];
            previewSection.style.display = 'block';
        }
    </script>
</body>
</html>
