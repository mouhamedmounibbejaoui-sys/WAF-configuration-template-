# Nginx configuration with ModSecurity WAF

# Load ModSecurity module from libnginx-mod-http-modsecurity package
load_module modules/ngx_http_modsecurity_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Rate limiting zones
    # General rate limit: 30 requests per second per IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    
    # Login rate limit: 5 requests per second per IP (prevent brute force)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
    
    # API rate limit: 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # Note: ModSecurity compilation skipped for simplicity
    # WAF protection via rate limiting and security headers instead

    # Upstream Flask app
    upstream flask_app {
        server flask-app:5000;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ModSecurity WAF Protection
        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsec/main.conf;

        # Rate limiting and reverse proxy configuration
        location / {
            # General rate limiting
            limit_req zone=general_limit burst=50 nodelay;
            
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Deny access to sensitive files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~ ~$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Login endpoint - strict rate limiting + SQL injection + XSS protection
        location /login {
            limit_req zone=login_limit burst=10 nodelay;
            
            # Block SQL injection patterns in URL
            if ($args ~* "(\b(SELECT|INSERT|UPDATE|DELETE|DROP|UNION|CREATE|ALTER|EXEC|EXECUTE)\b|--|#|/\*|\*/|or\s+1\s*=\s*1|'\s*or\s*'|and\s+1\s*=\s*1)") {
                return 403;
            }
            
            # Block XSS patterns in URL
            if ($args ~* "(<script|javascript:|onerror|onload|onclick|<iframe|<svg|eval\(|alert\(|confirm\()") {
                return 403;
            }
            
            # Block SQL injection in POST body (form data)
            if ($request_body ~* "(\b(SELECT|INSERT|UPDATE|DELETE|DROP|UNION|CREATE|ALTER|EXEC|EXECUTE)\b|--|#|/\*|\*/|or\s+1\s*=\s*1|'\s*or\s*'|and\s+1\s*=\s*1)") {
                return 403;
            }
            
            # Block XSS in POST body
            if ($request_body ~* "(<script|javascript:|onerror|onload|onclick|<iframe|<svg|eval\(|alert\(|confirm\()") {
                return 403;
            }
            
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Registration endpoint - rate limiting + SQL injection + XSS protection
        location /registre {
            limit_req zone=login_limit burst=10 nodelay;
            
            # Block SQL injection patterns
            if ($args ~* "(\b(SELECT|INSERT|UPDATE|DELETE|DROP|UNION|CREATE|ALTER|EXEC|EXECUTE)\b|--|#|/\*|\*/|or\s+1\s*=\s*1|'\s*or\s*'|and\s+1\s*=\s*1)") {
                return 403;
            }
            
            # Block XSS patterns
            if ($args ~* "(<script|javascript:|onerror|onload|onclick|<iframe|<svg|eval\(|alert\(|confirm\()") {
                return 403;
            }
            
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Preview endpoint - strict XSS protection
        location /preview {
            limit_req zone=general_limit burst=50 nodelay;
            
            # Block ANY < character in POST body (covers all HTML/script tags)
            if ($request_body ~* "<") {
                return 403;
            }
            
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
